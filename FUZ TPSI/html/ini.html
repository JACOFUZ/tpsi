<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurazione Negozio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="config-container">
    <form id="configForm" class="config-form">
        <h1>Configura il tuo negozio</h1>

        <input type="text" id="shopName" placeholder="Nome negozio" required>

        <input type="text" id="shopCategory" placeholder="Categoria negozio" required>

        <button type="submit">Entra nel negozio</button>
    </form>
</main>

<script src="js/config.js"></script>

</body>
</html>

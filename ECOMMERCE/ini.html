<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Negozio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 id="store-name-display">Setup Negozio</h1>
    </header>

    <main>
        <div class="setup-container">
            <h2>Configura il tuo e-commerce</h2>
            <form id="setup-form">
                <label for="store-name">Nome del Negozio:</label>
                <input type="text" id="store-name" required placeholder="Es. Nexus Gaming">
                
                <label for="store-category">Categoria (opzionale):</label>
                <input type="text" id="store-category" placeholder="Es. Accessori PC">
                
                <button type="submit" class="btn">Salva e Vai al Catalogo</button>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
